name: Mobile release

# 推送 v<major>.<minor>.<patch> 標籤時，自動編譯 Android／iOS 安裝包並附到該標籤的 GitHub Release。
# 也可在 Actions 頁面以 workflow_dispatch 手動觸發（需填版本號）。
#
# 需要的 secrets（未設定時對應步驟會略過，不會中斷流程）：
#   Android release 簽名：ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、
#                        ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
#   未設定時改為編譯 debug APK（debug 金鑰簽名，可直接安裝測試）。
#   iOS：IOS_TEAM_ID、IOS_CERTIFICATE_BASE64、IOS_CERTIFICATE_PASSWORD、
#        ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_BASE64（App Store Connect API 金鑰）
#    未設定 IOS_TEAM_ID 時改為編譯「未簽名」IPA，僅供自行重簽／驗證，無法直接安裝。
#    本機等價指令見 README「行動端發布」一節。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本號，例如 1.2.3（手動觸發時必填）
        required: true
        type: string

permissions:
  contents: write # 建立 Release 與上傳安裝包

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.28.2

jobs:
  verify:
    name: 型別與測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm test

  version:
    name: 解析版本
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      code: ${{ steps.parse.outputs.code }}
      tag: ${{ steps.parse.outputs.tag }}
      android_signed: ${{ steps.parse.outputs.android_signed }}
      ios_configured: ${{ steps.parse.outputs.ios_configured }}
    steps:
      # 標籤 v1.2.3 → versionName 1.2.3、versionCode 10203（可遞增且可讀）。
      - id: parse
        env:
          REQUESTED: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          requested="${REQUESTED#v}"
          if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本號必須是 <major>.<minor>.<patch>（可帶 v 前綴），收到：$REQUESTED" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$requested"
          android_signed=false
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then android_signed=true; fi
          ios_configured=false
          if [ -n "${IOS_TEAM_ID:-}" ]; then ios_configured=true; fi
          {
            echo "version=$requested"
            echo "code=$(( major * 10000 + minor * 100 + patch ))"
            echo "tag=v$requested"
            echo "android_signed=$android_signed"
            echo "ios_configured=$ios_configured"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android 安裝包
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # AGP 8.13／Gradle 8.14.3 需要 JDK 21；runner 預設的較新 JDK 無法執行本專案 Gradle。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 確保 Android SDK 元件
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "找不到 ANDROID_HOME／ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          if [ ! -d "$sdk_root/platforms/android-36" ]; then
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - run: npx cap sync android
      - name: 解出簽名金鑰
        if: needs.version.outputs.android_signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # keystore 二进制被截断/粘贴损坏时，Gradle 只在 packageRelease 才以
          # "Given final block not properly padded" 爆炸，晚且难定位；这里先挡一道。
          # 不提供口令，只验证「这是不是一个结构完好的 keystore 文件」。
          if keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass dummy-probe \
               > "$RUNNER_TEMP/keystore-probe.txt" 2>&1; then
            echo "keystore 解密成功（口令看起来也对）"
          elif grep -q 'password was incorrect\|password was not correct\|integrity' "$RUNNER_TEMP/keystore-probe.txt"; then
            echo "keystore 文件结构完好（口令需另验）"
          else
            echo "keystore 解出的檔案不完整或不是有效 JKS/PKCS12。常见原因：" >&2
            echo "  1) secret 里的 base64 被截断（尾部缺字符）" >&2
            echo "  2) 粘贴时带入了空格/漏了字符" >&2
            echo "  3) base64 的不是 .jks 二进制本身" >&2
            sed 's/^/    /' "$RUNNER_TEMP/keystore-probe.txt" >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "${GITHUB_ENV:-/dev/null}"
      # 用真实口令读 alias，把 Gradle 的 "Given final block not properly padded"
      # 提前拆成具体是哪个 secret 填错。keytool 的错误文案：
      #   store 口令错  → "keystore password was incorrect"
      #   key 口令错   → "Get Key failed: Given final block not properly padded"
      #   alias 不存在  → "Alias <x> does not exist"
      - name: 校驗簽名金鑰別名與口令
        if: needs.version.outputs.android_signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="${ANDROID_KEYSTORE_PATH:-$RUNNER_TEMP/release.keystore}"
          probe="$RUNNER_TEMP/keystore-key-probe.txt"

          # keytool -list 只驗 store 口令，不會碰 key 口令；Gradle 真正簽名時會取私鑰，
          # 那時才以 "Get Key failed: Given final block not properly padded" 爆炸。
          # 這裡先真的把私鑰取出來：certreq 會對 alias 的私鑰簽名。
          # PKCS12 的 key 口令與 store 口令相同，忽略 -keypass 也無妨。
          if ! keytool -list -v \
               -keystore "$keystore" \
               -storepass "$ANDROID_KEYSTORE_PASSWORD" \
               -alias "$ANDROID_KEY_ALIAS" > "$probe" 2>&1; then
            sed 's/^/    /' "$probe" >&2
            if grep -qi 'keystore password was incorrect\|integrity check failed\|EOFException\|Input/output error' "$probe"; then
              echo "→ ANDROID_KEYSTORE_PASSWORD（store 口令）不正確，或 base64 解出的檔案損壞。" >&2
              echo "  本機重建：keytool -list -keystore <jks>" >&2
            elif grep -qi 'does not exist\|不存在\|Cannot find' "$probe"; then
              echo "→ ANDROID_KEY_ALIAS 不是這個 keystore 裡的別名，請確認值是 '$ANDROID_KEY_ALIAS'。" >&2
            else
              echo "→ keystore 打不開，請把上面輸出整段貼出來。" >&2
            fi
            exit 1
          fi
          echo "keystore 可開啟：alias=$ANDROID_KEY_ALIAS"

          if ! keytool -certreq -alias "$ANDROID_KEY_ALIAS" \
               -keystore "$keystore" \
               -storepass "$ANDROID_KEYSTORE_PASSWORD" \
               -keypass "$ANDROID_KEY_PASSWORD" > "$probe" 2>&1; then
            sed 's/^/    /' "$probe" >&2
            if grep -q 'Get Key failed' "$probe"; then
              echo "→ ANDROID_KEY_PASSWORD（key 口令）打不開這個 key；" >&2
              echo "  store 口令（ANDROID_KEYSTORE_PASSWORD）是對的，問題在 key 口令。" >&2
              echo "  生成時兩次交互輸入若是不同口令，兩個 secret 必須分別填對應的值。" >&2
              echo "  口令忘了只能重生成金鑰，且無法再更新已用舊金鑰發布的安裝。" >&2
            elif grep -qi 'does not exist\|不存在' "$probe"; then
              echo "→ ANDROID_KEY_ALIAS 不是這個 keystore 裡的別名，請確認值是 '$ANDROID_KEY_ALIAS'。" >&2
            else
              echo "→ 未預期的 keytool 錯誤，請把上面輸出整段貼出來。" >&2
            fi
            exit 1
          fi

          echo "金鑰可用：alias=$ANDROID_KEY_ALIAS（私鑰可取）"
      - name: 編譯已簽名 release（APK 與 AAB）
        if: needs.version.outputs.android_signed == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionName=${{ needs.version.outputs.version }} \
            -PversionCode=${{ needs.version.outputs.code }}
      - name: 編譯 debug（未設定簽名金鑰時）
        if: needs.version.outputs.android_signed != 'true'
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PversionName=${{ needs.version.outputs.version }} \
            -PversionCode=${{ needs.version.outputs.code }}
      - name: 收集安裝包
        run: |
          set -euo pipefail
          version=${{ needs.version.outputs.version }}
          mkdir -p dist
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/toss-${version}.apk"
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab "dist/toss-${version}.aab"
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/toss-${version}-debug.apk"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS 安裝包
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - run: npx cap sync ios
      - name: 匯入簽名憑證與 App Store Connect 金鑰
        if: needs.version.outputs.ios_configured == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD ASC_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "缺少 secret：${name}（iOS 發布需要完整的 Apple 憑證設定）" >&2
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p actions "$keychain"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$keychain"
          # 保留 runner 既有 keychain，並把臨時 keychain 加入搜尋清單。
          existing_keychains=()
          while IFS= read -r keychain_path; do
            if [ -n "$keychain_path" ]; then
              existing_keychains+=("$keychain_path")
            fi
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"

          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc-key.p8"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-key.p8"
          } >> "$GITHUB_ENV"
      - name: Archive 並匯出 ad-hoc IPA
        if: needs.version.outputs.ios_configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          code='${{ needs.version.outputs.code }}'

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Toss.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$code" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Toss.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          mkdir -p dist
          cp "$RUNNER_TEMP/export/"*.ipa "dist/toss-${version}.ipa"
          ls -l dist
      # 未設定 Apple 憑證時仍產出未簽名 IPA：iOS 不會安裝未簽名或與描述檔不符的包，
      # 這份產物只能由持有付費帳號的人重簽，或作為本機驗證用途（詳見 README）。
      - name: 編譯未簽名 IPA
        if: needs.version.outputs.ios_configured != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Toss-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$CODE" \
            archive

          app="$RUNNER_TEMP/Toss-unsigned.xcarchive/Products/Applications/App.app"
          if [ ! -d "$app" ]; then
            echo "封存檔中找不到 App.app：$app" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          # -y 保留符號連結，避免 App.framework 之類的結構被展開成實體檔案。
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/toss-${VERSION}-unsigned.ipa" Payload)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  release:
    name: 建立 Release
    needs: [version, android, ios]
    if: always() && needs.version.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # gh 靠本地 git remote 推导目标仓库；此 job 若未 checkout，
      # gh release * 会以 "fatal: not a git repository" 失败。
      # checkout 之外再用 GH_REPO 显式指定，双保险。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 產生說明並發布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag='${{ needs.version.outputs.tag }}'
          version='${{ needs.version.outputs.version }}'

          {
            echo "## Toss 行動端安裝包 $version"
            echo
            echo "- 標籤：\`$tag\`"
            echo "- 提交：\`${GITHUB_SHA:0:12}\`"
            echo
            echo "### 下載"
            echo
            for file in dist/*; do
              size=$(du -h "$file" | cut -f1 | tr -d ' ')
              echo "- \`$(basename "$file")\`（${size}）"
            done
            echo
            echo "Android：下載 APK 後在裝置上允許「安裝未知來源應用程式」再安裝。"
            if [ -f "dist/toss-${version}-debug.apk" ]; then
              echo
              echo "> 本次未設定 Android release 簽名金鑰，附上的是 debug 金鑰簽名的測試包。"
            fi
            if [ -f "dist/toss-${version}-unsigned.ipa" ]; then
              echo
              echo "> 本次未設定 Apple 憑證，附上的是**未簽名** IPA。iOS 不會安裝未簽名或與描述檔不符的包，"
              echo "> 這份產物需由持有 Apple Developer Program 帳號的人重簽，或作為本機驗證用途。"
              echo "> 要讓測試者直接安裝，請參閱 README「行動端發布」一節的 iOS 分發說明。"
            elif ls dist/*.ipa > /dev/null 2>&1; then
              echo
              echo "iOS：IPA 使用 ad-hoc 描述檔，只有描述檔內註冊的裝置可以安裝；iOS 16 以上需在裝置上開啟開發者模式。"
            fi
          } > "$RUNNER_TEMP/notes.md"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "Toss $version" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" dist/* --title "Toss $version" --notes-file "$RUNNER_TEMP/notes.md"
          fi
